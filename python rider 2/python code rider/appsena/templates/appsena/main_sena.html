<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FN Coderider</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }

        h1 {
            color: #4a3f85;
            margin-bottom: 15px;
            font-size: 26px;
        }

        p {
            font-size: 18px;
            color: #555;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>¡Hola, Coderider!</h1>
        <p>¡Bienvenido a la página de FN Coderider!</p>
    </div>

</body>
</html>
