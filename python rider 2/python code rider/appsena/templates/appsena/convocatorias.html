<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Convocatorias</title>
</head>

<body>

    <div class="container">

        <h1>Convocatorias disponibles</h1>

        {% for convocatoria in convocatorias %}

            <div class="tarjeta">

                <h2>
                    {{ convocatoria.titulo_capacitacion }}
                </h2>

                <div class="info">

                    <p>
                        <strong>Tipo:</strong>
                        {{ convocatoria.tipo_capacitacion }}
                    </p>

                    <p>
                        <strong>Duración:</strong>
                        {{ convocatoria.duracion }}
                    </p>

                    <p>
                        <strong>Detalles:</strong>
                        {{ convocatoria.detalles }}
                    </p>

                </div>

            </div>

        {% empty %}

            <p>No hay convocatorias disponibles.</p>

        {% endfor %}

    </div>

</body>

</html>
